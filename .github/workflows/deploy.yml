name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64      # 1 kiến trúc (VPS amd64) — tránh build đa-arch chậm
          provenance: false           # manifest ĐƠN → pull gọn
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha        # tái dùng layer giữa các lần build
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* bị nội tuyến lúc build → phải truyền vào đây (xem Dockerfile).
          # Giá trị public (URL + anon key); lưu ở Secrets để log CI không lộ, dù bản thân là public.
          # NEXT_PUBLIC_GOOGLE_SSO_ENABLED: chỉ đặt = 1 (GitHub Variable) SAU KHI đã cắm xong
          # OAuth Client thật + Supabase Dashboard (docs/google-sso-setup.md) — build lại sau khi đặt.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_GOOGLE_SSO_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_SSO_ENABLED }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Chỉ chạy khi đã dựng xong platform (Coolify) và bật cờ. Chưa set → chỉ build+push GHCR.
    if: ${{ vars.DEPLOY_ON == 'true' }}
    steps:
      # --retry: webhook này ĐÃ từng trả 520 một lần (lỗi chớp nhoáng phía Coolify/Cloudflare).
      # Hậu quả im lặng và nguy hiểm: job build vẫn xanh, ảnh mới đã nằm trên GHCR, nhưng
      # Coolify không được báo để kéo về → production lặng lẽ chạy tiếp bản CŨ mà không có dấu
      # hiệu gì. Thử lại 5 lần cách nhau 10 giây để một cú nấc không bỏ lỡ cả bản deploy.
      # (Kiểm chứng bản đang chạy: mở /api/health, trường `commit`.)
      - run: |
          curl -fsS -X POST \
            --retry 5 --retry-delay 10 --retry-all-errors --max-time 120 \
            "${{ secrets.DEPLOY_HOOK_URL }}/api/v1/deploy?uuid=${{ secrets.DEPLOY_APP_ID }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}"
